satisfactory.solver {
  # Where api answers over plain HTTP on a laptop or in a test. A cluster ignores it: there every
  # service port is mutual TLS, and the solver calls the ankka service named by api-service as itself.
  api-url = "http://localhost:9000"
  api-url = ${?SAT_API_URL}
  api-service = "api"
  api-service = ${?SAT_API_SERVICE}
  runner-token = "local-runner-token"
  runner-token = ${?SAT_RUNNER_TOKEN}
  # 0: cores - 1, at least 1
  slots = 0
  slots = ${?SAT_SLOTS}
  heartbeat = 5s
  report-interval = 1s
}
