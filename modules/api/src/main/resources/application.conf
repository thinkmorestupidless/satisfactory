# satisfactory api. Every setting has an SAT_* override for deployment.

# Submissions may be 100 MB compressed (API.md §2.1); the body is read strictly, so allow it and
# give it time. Research R9: 2 GB uncompressed is capped while inflating, not here.
pekko.http.server.parsing.max-content-length = 128m
# ankka reads bodies with toStrict, which pekko-http caps separately (8m by default). Both are needed
# (verified at implementation, research V4).
pekko.http.parsing.max-to-strict-bytes = 128m
ankka.http.body-timeout = 120s

satisfactory {
  # Shared with the solver service; /internal/* is refused without it.
  runner-token = "local-runner-token"
  runner-token = ${?SAT_RUNNER_TOKEN}

  # Encrypts webhook signing secrets at rest in the tenant entity.
  secret-key = "local-development-secret-key-change-me"
  secret-key = ${?SAT_SECRET_KEY}

  # The runner in-process (ControlChannel.Local): `sbt api/run` is then the whole system.
  local-runner = true
  local-runner = ${?SAT_LOCAL_RUNNER}
  local-slots = 1
  local-slots = ${?SAT_LOCAL_SLOTS}

  # A tenant `t_local` with this read-write key is created at startup when set. Development only:
  # refused when the platform API's identity provider is configured.
  bootstrap-key = ""
  bootstrap-key = ${?SAT_BOOTSTRAP_KEY}

  # postgres (the service's own database) or memory
  blobs = postgres
  blobs = ${?SAT_BLOBS}

  # How API links in webhooks and responses are rooted.
  public-url = "http://localhost:9000"
  public-url = ${?SAT_PUBLIC_URL}

  # Prometheus scrapes /metrics with `Authorization: Bearer <this>`; unset, /metrics refuses everyone.
  metrics-token = ""
  metrics-token = ${?SAT_METRICS_TOKEN}

  lease-ttl = 20s
  heartbeat = 5s
  max-attempts = 3
  claim-wait = 5s

  # Timefold's delivery rules (API.md §2.4): 5 s to answer, up to 10 attempts 10 s apart.
  webhooks {
    timeout = 5s
    retry-interval = 10s
    max-attempts = 10
  }

  defaults {
    concurrency = 2
    submit-per-minute = 60
    lifetime-ceiling = 12h
    retention = 30d
  }

  auth {
    issuer = ""
    issuer = ${?SAT_AUTH_ISSUER}
    jwks-url = ""
    jwks-url = ${?SAT_AUTH_JWKS_URL}
    operator-role = "satisfactory-operator"
  }
}
