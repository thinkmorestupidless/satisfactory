satisfactory.solver {
  # Set: `api` at this address over plain HTTP (a laptop, a test). Empty: the ankka service named
  # by api-service, called as this service — mutual TLS in a cluster, the local registry on a laptop.
  api-url = ""
  api-url = ${?SAT_API_URL}
  api-service = "api"
  api-service = ${?SAT_API_SERVICE}
  runner-token = "local-runner-token"
  runner-token = ${?SAT_RUNNER_TOKEN}
  # 0: cores - 1, at least 1
  slots = 0
  slots = ${?SAT_SLOTS}
  heartbeat = 5s
  report-interval = 1s
}
